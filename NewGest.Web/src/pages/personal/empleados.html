<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Empleados — NewGest</title>
  <link rel="stylesheet" href="/css/output.css" />
</head>
<body class="bg-gray-50 font-sans">

  <main class="ml-64 p-8">
    <div class="flex items-center justify-between mb-6">
      <h1 class="text-2xl font-bold text-gray-800">Empleados</h1>
      <button id="btn-nuevo" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium">
        + Nuevo empleado
      </button>
    </div>

    <!-- Filtros -->
    <div class="mb-4 flex gap-3 flex-wrap">
      <input id="search" type="text" placeholder="Buscar por nombre, legajo o CUIL..."
        class="border border-gray-300 rounded-lg px-4 py-2 text-sm w-72 focus:outline-none focus:ring-2 focus:ring-blue-500" />
      <label class="flex items-center gap-2 text-sm text-gray-600 cursor-pointer">
        <input id="solo-vendedores" type="checkbox" class="rounded" />
        Solo vendedores
      </label>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
      <table class="w-full text-sm">
        <thead class="bg-gray-50 border-b border-gray-200">
          <tr>
            <th class="text-left px-4 py-3 font-medium text-gray-600">Legajo</th>
            <th class="text-left px-4 py-3 font-medium text-gray-600">Apellido y Nombre</th>
            <th class="text-left px-4 py-3 font-medium text-gray-600">CUIL</th>
            <th class="text-left px-4 py-3 font-medium text-gray-600">Rol</th>
            <th class="text-center px-4 py-3 font-medium text-gray-600">Vendedor</th>
            <th class="text-right px-4 py-3 font-medium text-gray-600">Comisión</th>
            <th class="px-4 py-3"></th>
          </tr>
        </thead>
        <tbody id="tabla-empleados" class="divide-y divide-gray-100">
          <tr><td colspan="7" class="px-4 py-8 text-center text-gray-400 text-sm">Cargando...</td></tr>
        </tbody>
      </table>
    </div>
    <div id="paginacion" class="flex items-center justify-between mt-4 text-sm text-gray-600"></div>
  </main>

  <!-- Modal ABM Empleado -->
  <div id="modal-empleado" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-md mx-4">
      <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200">
        <h2 id="modal-titulo" class="text-lg font-semibold text-gray-800">Nuevo Empleado</h2>
        <button id="modal-close" class="text-gray-400 hover:text-gray-600 text-xl leading-none">&times;</button>
      </div>
      <form id="form-empleado" class="p-6 space-y-4">
        <input type="hidden" name="idEmpleado" />
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Legajo</label>
          <input name="legajo" type="text" required maxlength="10"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Apellido y Nombre</label>
          <input name="apellidoNombre" type="text" required
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">CUIL (sin guiones)</label>
          <input name="cuil" type="text" maxlength="13" placeholder="20123456786"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500" />
          <p id="cuil-error" class="text-red-500 text-xs mt-1 hidden">CUIL inválido</p>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Rol</label>
          <select name="rol" required
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500">
            <option value="1">Vendedor</option>
            <option value="2">Administrativo</option>
            <option value="3">Depósito</option>
            <option value="4">Gerencia</option>
            <option value="5">Otro</option>
          </select>
        </div>
        <div id="campo-comision" class="hidden">
          <label class="block text-sm font-medium text-gray-700 mb-1">Comisión (%)</label>
          <input name="comisionPorcentaje" type="number" step="0.01" min="0" max="100"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500" />
        </div>
        <div id="form-error" class="text-red-600 text-sm hidden"></div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" id="btn-cancelar" class="px-4 py-2 text-sm text-gray-600 hover:text-gray-800">Cancelar</button>
          <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-700">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="/js/pages/personal/empleados.js"></script>
</body>
</html>
