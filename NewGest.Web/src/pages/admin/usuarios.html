<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Usuarios — NewGest Admin</title>
  <link rel="stylesheet" href="/css/input.css" />
</head>
<body class="bg-gray-50 font-sans">

  <!-- ─── Layout ──────────────────────────────────────────────────────────── -->
  <div class="flex min-h-screen">

    <!-- Sidebar simple para admin -->
    <aside class="w-64 bg-brand-800 text-white flex flex-col flex-shrink-0">
      <div class="px-6 py-5 border-b border-brand-700">
        <span class="text-xl font-bold tracking-tight">NewGest</span>
        <span class="block text-xs text-blue-300 mt-0.5">Administración</span>
      </div>
      <nav class="flex-1 px-3 py-4 space-y-1">
        <a href="/pages/admin/usuarios.html"
          class="flex items-center gap-3 px-3 py-2 rounded-lg bg-white/10 text-white text-sm font-medium">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/>
          </svg>
          Usuarios
        </a>
      </nav>
      <div class="px-4 py-4 border-t border-brand-700">
        <button id="btn-logout"
          class="flex items-center gap-2 text-sm text-blue-200 hover:text-white transition-colors">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
          </svg>
          Cerrar sesión
        </button>
      </div>
    </aside>

    <!-- Contenido principal -->
    <main class="flex-1 overflow-x-hidden p-8">

      <!-- Cabecera -->
      <div class="flex items-center justify-between mb-6">
        <div>
          <h1 class="text-2xl font-bold text-gray-800">Usuarios</h1>
          <p class="text-sm text-gray-500 mt-0.5">Gestión de accesos al sistema</p>
        </div>
        <button id="btn-nuevo-usuario"
          class="btn-primary flex items-center gap-2">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/>
          </svg>
          Nuevo usuario
        </button>
      </div>

      <!-- Búsqueda -->
      <div class="mb-4 flex gap-3 items-center">
        <div class="relative flex-1 max-w-md">
          <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400"
            fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
          <input id="search-usuarios" type="text"
            placeholder="Buscar por nombre, usuario o legajo..."
            class="form-input pl-9" />
        </div>
        <label class="flex items-center gap-2 text-sm text-gray-600 cursor-pointer">
          <input type="checkbox" id="solo-activos" checked class="rounded border-gray-300 text-brand-600" />
          Solo activos
        </label>
      </div>

      <!-- Tabla -->
      <div class="card overflow-hidden">
        <table class="w-full text-sm">
          <thead class="bg-gray-50 border-b border-gray-200">
            <tr>
              <th class="text-left px-4 py-3 font-medium text-gray-600 whitespace-nowrap">Usuario</th>
              <th class="text-left px-4 py-3 font-medium text-gray-600">Nombre</th>
              <th class="text-left px-4 py-3 font-medium text-gray-600">Legajo</th>
              <th class="text-left px-4 py-3 font-medium text-gray-600">Último ingreso</th>
              <th class="text-left px-4 py-3 font-medium text-gray-600">Estado</th>
              <th class="px-4 py-3"></th>
            </tr>
          </thead>
          <tbody id="tabla-usuarios" class="divide-y divide-gray-100">
            <tr>
              <td colspan="6" class="px-4 py-8 text-center text-gray-400 text-sm">Cargando...</td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Paginación -->
      <div id="paginacion" class="flex items-center justify-between mt-4 text-sm text-gray-600">
      </div>

    </main>
  </div>

  <!-- ─── Modal ABM ─────────────────────────────────────────────────────────── -->
  <ng-modal id="modal-usuario" titulo="Nuevo usuario" width="max-w-xl">
    <form id="form-usuario" class="space-y-4 px-6 py-5" novalidate>

      <!-- Nombre -->
      <div>
        <label class="form-label">Nombre completo</label>
        <input name="nombre" type="text" required
          class="form-input" placeholder="Apellido y Nombre" />
        <p class="form-error hidden" data-for="nombre">El nombre es requerido.</p>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <!-- Usuario -->
        <div>
          <label class="form-label">Nombre de usuario</label>
          <input name="userName" type="text" required
            class="form-input" placeholder="ej: jperez" />
          <p class="form-error hidden" data-for="userName">Requerido.</p>
        </div>

        <!-- Legajo -->
        <div>
          <label class="form-label">Legajo <span class="text-gray-400 font-normal">(opcional)</span></label>
          <input name="legajo" type="text"
            class="form-input" placeholder="ej: 001" />
        </div>
      </div>

      <!-- Contraseña (solo en creación) -->
      <div id="seccion-password">
        <label class="form-label">Contraseña inicial</label>
        <input name="password" type="password" required
          class="form-input" placeholder="Mínimo 8 caracteres" />
        <p class="text-xs text-gray-500 mt-1">El usuario deberá cambiarla en el primer ingreso.</p>
        <p class="form-error hidden" data-for="password">Mínimo 8 caracteres con al menos un número.</p>
      </div>

      <!-- Permisos -->
      <div>
        <label class="form-label">Permisos de módulos</label>
        <div id="lista-permisos" class="border border-gray-200 rounded-lg p-3 grid grid-cols-2 gap-2 max-h-48 overflow-y-auto">
          <!-- Generado por JS -->
        </div>
      </div>

      <!-- Activo (solo en edición) -->
      <div id="seccion-activo" class="hidden">
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" name="activo" class="rounded border-gray-300 text-brand-600" />
          <span class="text-sm font-medium text-gray-700">Usuario activo</span>
        </label>
      </div>

      <!-- Botones -->
      <div class="flex items-center justify-between pt-2 border-t border-gray-100">
        <button type="button" id="btn-resetear-password"
          class="hidden text-sm text-orange-600 hover:text-orange-800 underline">
          Resetear contraseña
        </button>
        <div class="flex gap-2 ml-auto">
          <button type="button" data-close class="btn-secondary">Cancelar</button>
          <button type="submit" id="btn-guardar-usuario" class="btn-primary flex items-center gap-2">
            <svg id="guardar-spinner" class="hidden w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
            </svg>
            Guardar
          </button>
        </div>
      </div>

    </form>
  </ng-modal>

  <!-- ─── Scripts ───────────────────────────────────────────────────────────── -->
  <script type="module" src="/js/components/ng-modal.js"></script>
  <script type="module" src="/js/components/ng-alert.js"></script>
  <script type="module" src="/js/pages/admin/usuarios.js"></script>
</body>
</html>
