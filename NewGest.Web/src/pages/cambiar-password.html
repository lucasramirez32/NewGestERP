<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cambiar contraseña — NewGest</title>
  <link rel="stylesheet" href="/css/input.css" />
</head>
<body class="min-h-screen bg-gradient-to-br from-brand-800 to-brand-600 flex items-center justify-center p-4">

  <div class="w-full max-w-md">

    <!-- Cabecera -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 bg-white rounded-2xl shadow-lg mb-4">
        <svg class="w-8 h-8 text-brand-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
            d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-white">Cambiar contraseña</h1>
      <p class="text-blue-200 text-sm mt-1">Es necesario actualizar tu contraseña para continuar</p>
    </div>

    <!-- Card -->
    <div class="card p-8">

      <!-- Alerta de error -->
      <div id="alert-error" class="hidden alert-error mb-4" role="alert">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
        </svg>
        <span id="alert-error-msg"></span>
      </div>

      <!-- Alerta de éxito -->
      <div id="alert-success" class="hidden alert-success mb-4" role="alert">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
        </svg>
        <span>Contraseña actualizada correctamente. Redirigiendo...</span>
      </div>

      <form id="form-password" class="space-y-5" novalidate>

        <!-- Contraseña actual -->
        <div>
          <label for="password-actual" class="form-label">Contraseña actual</label>
          <input id="password-actual" name="passwordActual" type="password" required
            autocomplete="current-password"
            placeholder="Ingrese su contraseña actual"
            class="form-input" />
          <p id="password-actual-error" class="form-error hidden">La contraseña actual es requerida.</p>
        </div>

        <!-- Nueva contraseña -->
        <div>
          <label for="password-nueva" class="form-label">Nueva contraseña</label>
          <input id="password-nueva" name="passwordNueva" type="password" required
            autocomplete="new-password"
            placeholder="Mínimo 8 caracteres con al menos un número"
            class="form-input" />
          <!-- Indicador de fortaleza -->
          <div class="mt-2 flex gap-1" id="strength-bars">
            <div class="h-1 flex-1 rounded bg-gray-200" data-level="1"></div>
            <div class="h-1 flex-1 rounded bg-gray-200" data-level="2"></div>
            <div class="h-1 flex-1 rounded bg-gray-200" data-level="3"></div>
            <div class="h-1 flex-1 rounded bg-gray-200" data-level="4"></div>
          </div>
          <p id="password-nueva-error" class="form-error hidden">Mínimo 8 caracteres con al menos un número.</p>
        </div>

        <!-- Confirmar contraseña -->
        <div>
          <label for="password-confirmar" class="form-label">Confirmar nueva contraseña</label>
          <input id="password-confirmar" name="passwordConfirmar" type="password" required
            autocomplete="new-password"
            placeholder="Repita la nueva contraseña"
            class="form-input" />
          <p id="password-confirmar-error" class="form-error hidden">Las contraseñas no coinciden.</p>
        </div>

        <!-- Botón -->
        <button type="submit" id="btn-cambiar"
          class="btn-primary w-full flex items-center justify-center gap-2 py-2.5">
          <svg id="submit-spinner" class="hidden w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
          </svg>
          <span id="btn-text">Cambiar contraseña</span>
        </button>

      </form>

      <div class="mt-4 text-center">
        <button id="btn-cancelar"
          class="text-sm text-gray-500 hover:text-gray-700 underline">
          Cancelar sesión
        </button>
      </div>
    </div>
  </div>

  <script type="module" src="/js/pages/cambiar-password.js"></script>
</body>
</html>
