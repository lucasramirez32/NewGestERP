<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ingresar — NewGest</title>
  <link rel="stylesheet" href="/css/input.css" />
</head>
<body class="min-h-screen bg-gradient-to-br from-brand-800 to-brand-600 flex items-center justify-center p-4">

  <div class="w-full max-w-md">

    <!-- Logo + Título -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-white rounded-2xl shadow-lg mb-4">
        <svg class="w-9 h-9 text-brand-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
            d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414A1 1 0 0119 9.414V19a2 2 0 01-2 2z"/>
        </svg>
      </div>
      <h1 class="text-3xl font-bold text-white">NewGest</h1>
      <p class="text-blue-200 text-sm mt-1">Sistema de Gestión Empresarial</p>
    </div>

    <!-- Card de login -->
    <div class="card p-8">
      <h2 class="text-xl font-semibold text-gray-800 mb-6">Iniciar sesión</h2>

      <!-- Alerta de error -->
      <div id="alert-error" class="hidden alert-error mb-4" role="alert">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
        </svg>
        <span id="alert-error-msg">Error</span>
      </div>

      <form id="form-login" class="space-y-5" novalidate>

        <!-- Empresa -->
        <div>
          <label for="empresa" class="form-label">Empresa</label>
          <div class="relative">
            <select id="empresa" name="idEmpresa" required
              class="form-input appearance-none pr-8 bg-white">
              <option value="">Cargando empresas...</option>
            </select>
            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-500">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
              </svg>
            </div>
          </div>
          <p id="empresa-error" class="form-error hidden">Seleccione una empresa.</p>
        </div>

        <!-- Usuario -->
        <div>
          <label for="usuario" class="form-label">Usuario</label>
          <input id="usuario" name="nombreUsuario" type="text" required autocomplete="username"
            placeholder="Ingrese su usuario"
            class="form-input" />
          <p id="usuario-error" class="form-error hidden">El usuario es requerido.</p>
        </div>

        <!-- Contraseña -->
        <div>
          <label for="password" class="form-label">Contraseña</label>
          <div class="relative">
            <input id="password" name="password" type="password" required autocomplete="current-password"
              placeholder="Ingrese su contraseña"
              class="form-input pr-10" />
            <button type="button" id="toggle-password"
              class="absolute inset-y-0 right-0 px-3 text-gray-400 hover:text-gray-600 transition-colors"
              aria-label="Mostrar/ocultar contraseña">
              <!-- Ícono de ojo — se alterna con JS -->
              <svg id="eye-open" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
              <svg id="eye-closed" class="w-5 h-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
              </svg>
            </button>
          </div>
          <p id="password-error" class="form-error hidden">La contraseña es requerida.</p>
        </div>

        <!-- Botón submit -->
        <button type="submit" id="btn-login"
          class="btn-primary w-full flex items-center justify-center gap-2 py-2.5">
          <svg id="login-spinner" class="hidden w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
            <path class="opacity-75" fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
          </svg>
          <span id="login-btn-text">Ingresar</span>
        </button>

      </form>
    </div>

    <p class="text-center text-blue-200 text-xs mt-6">
      &copy; 2026 NewGest — v2.0
    </p>
  </div>

  <script type="module" src="/js/pages/login.js"></script>
</body>
</html>
