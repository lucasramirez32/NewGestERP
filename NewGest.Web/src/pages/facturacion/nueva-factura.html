<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nueva Factura — NewGest</title>
  <link rel="stylesheet" href="/css/output.css" />
</head>
<body class="bg-gray-50 font-sans">

  <main class="ml-64 p-8">
    <div class="flex items-center justify-between mb-6">
      <h1 class="text-2xl font-bold text-gray-800">Nueva Factura</h1>
      <a href="/pages/facturacion/comprobantes.html" class="text-sm text-gray-500 hover:text-gray-700">
        &larr; Ver comprobantes
      </a>
    </div>

    <form id="form-factura" class="grid grid-cols-1 lg:grid-cols-3 gap-6">

      <!-- ─── Panel izquierdo: datos del encabezado + items ─── -->
      <div class="lg:col-span-2 space-y-6">

        <!-- Encabezado -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
          <h2 class="text-base font-semibold text-gray-700 mb-4">Encabezado</h2>
          <div class="grid grid-cols-2 gap-4">

            <div>
              <label class="block text-xs font-medium text-gray-600 mb-1">Tipo de comprobante</label>
              <select id="tipo" name="tipo" required
                class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                <option value="1">Factura A</option>
                <option value="6" selected>Factura B</option>
                <option value="11">Factura C</option>
                <option value="3">Nota de Crédito A</option>
                <option value="8">Nota de Crédito B</option>
                <option value="13">Nota de Crédito C</option>
                <option value="2">Nota de Débito A</option>
                <option value="7">Nota de Débito B</option>
                <option value="12">Nota de Débito C</option>
              </select>
            </div>

            <div>
              <label class="block text-xs font-medium text-gray-600 mb-1">Punto de venta</label>
              <input id="punto-venta" name="puntoVenta" type="number" min="1" max="9999" value="1" required
                class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
            </div>

            <div class="col-span-2">
              <label class="block text-xs font-medium text-gray-600 mb-1">Fecha</label>
              <input id="fecha" name="fecha" type="date" required
                class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
            </div>

          </div>
        </div>

        <!-- Cliente -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
          <h2 class="text-base font-semibold text-gray-700 mb-4">Cliente</h2>

          <div class="relative">
            <input id="cliente-search" type="text" placeholder="Buscar por razón social o CUIT..."
              autocomplete="off"
              class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
            <ul id="cliente-dropdown"
              class="hidden absolute z-10 w-full bg-white border border-gray-200 rounded-lg shadow-lg mt-1 max-h-48 overflow-y-auto text-sm">
            </ul>
          </div>

          <div id="cliente-seleccionado" class="hidden mt-3 p-3 bg-blue-50 rounded-lg text-sm">
            <p class="font-medium text-blue-800" id="cliente-nombre"></p>
            <p class="text-blue-600 text-xs" id="cliente-cuit"></p>
            <p class="text-blue-600 text-xs" id="cliente-condicion"></p>
            <input type="hidden" id="id-cliente" name="idCliente" />
          </div>
        </div>

        <!-- Items -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-base font-semibold text-gray-700">Ítems</h2>
            <button type="button" id="btn-agregar-item"
              class="text-sm text-blue-600 hover:text-blue-800 font-medium">
              + Agregar ítem
            </button>
          </div>

          <table class="w-full text-sm">
            <thead>
              <tr class="text-left text-xs font-medium text-gray-500 border-b border-gray-200">
                <th class="pb-2 w-2/5">Artículo</th>
                <th class="pb-2 w-16 text-right">Cant.</th>
                <th class="pb-2 w-24 text-right">P. Unit.</th>
                <th class="pb-2 w-20">IVA</th>
                <th class="pb-2 w-24 text-right">Subtotal</th>
                <th class="pb-2 w-8"></th>
              </tr>
            </thead>
            <tbody id="tabla-items">
              <!-- filas generadas por JS -->
            </tbody>
          </table>

          <p id="sin-items" class="text-center text-gray-400 text-sm py-6">
            Agregá al menos un ítem para continuar.
          </p>
        </div>
      </div>

      <!-- ─── Panel derecho: totales + emitir ─── -->
      <div class="lg:col-span-1">
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 sticky top-8">
          <h2 class="text-base font-semibold text-gray-700 mb-4">Totales</h2>

          <div class="space-y-2 text-sm">
            <div class="flex justify-between text-gray-600">
              <span>Neto 21%</span>
              <span id="neto-21" class="font-mono">$ 0,00</span>
            </div>
            <div class="flex justify-between text-gray-600">
              <span>IVA 21%</span>
              <span id="iva-21" class="font-mono">$ 0,00</span>
            </div>
            <div class="flex justify-between text-gray-600">
              <span>Neto 10,5%</span>
              <span id="neto-105" class="font-mono">$ 0,00</span>
            </div>
            <div class="flex justify-between text-gray-600">
              <span>IVA 10,5%</span>
              <span id="iva-105" class="font-mono">$ 0,00</span>
            </div>
            <div class="flex justify-between text-gray-600">
              <span>Exento</span>
              <span id="total-exento" class="font-mono">$ 0,00</span>
            </div>
            <div class="border-t border-gray-200 pt-2 mt-2 flex justify-between font-bold text-lg text-gray-800">
              <span>Total</span>
              <span id="total-general" class="font-mono text-blue-600">$ 0,00</span>
            </div>
          </div>

          <button type="submit" id="btn-emitir"
            class="mt-6 w-full bg-blue-600 hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed
                   text-white font-medium py-3 px-4 rounded-lg text-sm transition-colors">
            Emitir comprobante
          </button>

          <p id="msg-error" class="hidden mt-3 text-xs text-red-600 bg-red-50 p-2 rounded"></p>
        </div>
      </div>

    </form>
  </main>

  <!-- Dialog de confirmación de CAE -->
  <dialog id="dialog-cae"
    class="rounded-xl shadow-2xl p-8 w-full max-w-md backdrop:bg-black/40">
    <div class="text-center">
      <div class="w-12 h-12 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
        <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
        </svg>
      </div>
      <h3 class="text-lg font-bold text-gray-800 mb-2">Comprobante emitido</h3>
      <p id="dialog-tipo-numero" class="text-sm text-gray-600 mb-4"></p>
      <div id="dialog-cae-info" class="hidden bg-gray-50 rounded-lg p-3 text-left text-xs text-gray-700 mb-4 font-mono space-y-1">
        <p><span class="font-semibold">CAE:</span> <span id="dialog-cae-codigo"></span></p>
        <p><span class="font-semibold">Vence:</span> <span id="dialog-cae-vencimiento"></span></p>
      </div>
      <div class="flex gap-3 justify-center">
        <button id="dialog-nueva"
          class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium">
          Nueva factura
        </button>
        <button id="dialog-cerrar"
          class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-lg text-sm font-medium"
          onclick="document.getElementById('dialog-cae').close()">
          Cerrar
        </button>
      </div>
    </div>
  </dialog>

  <script type="module" src="/js/pages/facturacion/nueva-factura.js"></script>
</body>
</html>
