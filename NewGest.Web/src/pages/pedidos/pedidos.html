<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pedidos — NewGest</title>
  <link rel="stylesheet" href="/css/output.css" />
</head>
<body class="bg-gray-50 font-sans">

  <main class="ml-64 p-8">
    <div class="flex items-center justify-between mb-6">
      <h1 class="text-2xl font-bold text-gray-800">Pedidos</h1>
      <button id="btn-nuevo" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium">
        + Nuevo pedido
      </button>
    </div>

    <!-- Filtro estado -->
    <div class="mb-4 flex gap-2 flex-wrap">
      <button class="filtro-estado px-3 py-1 rounded-full text-sm font-medium bg-gray-200 text-gray-800 hover:bg-gray-300" data-estado="">Todos</button>
      <button class="filtro-estado px-3 py-1 rounded-full text-sm font-medium bg-yellow-100 text-yellow-800 hover:bg-yellow-200" data-estado="1">Pendiente</button>
      <button class="filtro-estado px-3 py-1 rounded-full text-sm font-medium bg-blue-100 text-blue-800 hover:bg-blue-200" data-estado="2">Parcial</button>
      <button class="filtro-estado px-3 py-1 rounded-full text-sm font-medium bg-green-100 text-green-800 hover:bg-green-200" data-estado="3">Entregado</button>
      <button class="filtro-estado px-3 py-1 rounded-full text-sm font-medium bg-gray-100 text-gray-500 hover:bg-gray-200" data-estado="4">Anulado</button>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
      <table class="w-full text-sm">
        <thead class="bg-gray-50 border-b border-gray-200">
          <tr>
            <th class="text-left px-4 py-3 font-medium text-gray-600">#</th>
            <th class="text-left px-4 py-3 font-medium text-gray-600">Cliente</th>
            <th class="text-left px-4 py-3 font-medium text-gray-600">Fecha</th>
            <th class="text-left px-4 py-3 font-medium text-gray-600">Entrega Est.</th>
            <th class="text-center px-4 py-3 font-medium text-gray-600">Estado</th>
            <th class="text-center px-4 py-3 font-medium text-gray-600">Items</th>
            <th class="px-4 py-3"></th>
          </tr>
        </thead>
        <tbody id="tabla-pedidos" class="divide-y divide-gray-100">
          <tr><td colspan="7" class="px-4 py-8 text-center text-gray-400 text-sm">Cargando...</td></tr>
        </tbody>
      </table>
    </div>
    <div id="paginacion" class="flex items-center justify-between mt-4 text-sm text-gray-600"></div>
  </main>

  <!-- Modal: Nuevo Pedido -->
  <div id="modal-pedido" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-2xl mx-4 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200 sticky top-0 bg-white">
        <h2 class="text-lg font-semibold text-gray-800">Nuevo Pedido</h2>
        <button class="modal-close text-gray-400 hover:text-gray-600 text-xl leading-none">&times;</button>
      </div>
      <form id="form-pedido" class="p-6 space-y-4">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">ID Cliente</label>
            <input name="idCliente" type="number" required min="1"
              class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Vendedor (opcional)</label>
            <select name="idVendedor"
              class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500">
              <option value="">Sin vendedor</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Fecha entrega estimada</label>
            <input name="fechaEntregaEstimada" type="date"
              class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Observaciones</label>
            <input name="observaciones" type="text"
              class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500" />
          </div>
        </div>

        <!-- Items del pedido -->
        <div>
          <div class="flex items-center justify-between mb-2">
            <label class="text-sm font-medium text-gray-700">Artículos</label>
            <button type="button" id="btn-agregar-item"
              class="text-blue-600 hover:text-blue-800 text-sm font-medium">+ Agregar</button>
          </div>
          <div id="items-pedido" class="space-y-2">
            <!-- items dinámicos -->
          </div>
        </div>

        <div id="pedido-error" class="text-red-600 text-sm hidden"></div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" class="modal-close px-4 py-2 text-sm text-gray-600 hover:text-gray-800">Cancelar</button>
          <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-700">Guardar pedido</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Generar Remito -->
  <div id="modal-remito" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-xl mx-4 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200 sticky top-0 bg-white">
        <h2 class="text-lg font-semibold text-gray-800">Generar Remito</h2>
        <button class="remito-close text-gray-400 hover:text-gray-600 text-xl leading-none">&times;</button>
      </div>
      <div class="p-6 space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Depósito de origen</label>
          <select id="remito-deposito"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500">
            <option value="">Cargando...</option>
          </select>
        </div>
        <div id="remito-items" class="space-y-2">
          <!-- items del pedido con cantidad a despachar -->
        </div>
        <div id="remito-error" class="text-red-600 text-sm hidden"></div>
        <div class="flex justify-end gap-2 pt-2">
          <button class="remito-close px-4 py-2 text-sm text-gray-600 hover:text-gray-800">Cancelar</button>
          <button id="btn-confirmar-remito" class="bg-green-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-green-700">Confirmar despacho</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/js/pages/pedidos/pedidos.js"></script>
</body>
</html>
